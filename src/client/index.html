<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FORTUNA</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app">
      <section class="panel">
        <h1>FORTUNA</h1>
        <p class="tagline">Ask a question, consult the nebula.</p>

        <form id="fortune-form">
          <label for="question">Your question</label>
          <input
            id="question"
            name="question"
            type="text"
            placeholder="What is on your mind?"
            required
          />
          <button type="submit">Reveal fortune</button>
        </form>

        <div id="fortune-output" class="fortune-output">
          <span class="placeholder">Your fortune will appear here.</span>
        </div>

        <a href="/nebula-background.html" class="link">
          View nebula background demo
        </a>
      </section>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
