<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FORTUNA</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rye&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Nebula background canvas -->
    <canvas id="bg-canvas"></canvas>

    <!-- Splash overlay -->
    <div class="splash-overlay" id="splash">
      <div class="splash-wrapper">
        <!-- Rotating wheel behind title -->
        <img
          src="/server/assets/wheel.png"
          alt="Fortuna wheel"
          class="splash-wheel"
        />

        <!-- 2-line intro text (appears together) -->
        <div class="splash-title" id="splash-title" aria-label="Ask Fortuna">
          <div class="splash-line">
            <span>A</span><span>S</span><span>K</span>
          </div>
          <div class="splash-line">
            <span>F</span><span>O</span><span>R</span><span>T</span>
            <span>U</span><span>N</span><span>A</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Main app content -->
    <main class="app" id="app-root">
      <section class="panel">
        <h1>FORTUNA</h1>
        <p class="tagline">Ask a question, consult the nebula.</p>

        <form id="fortune-form">
          <label for="question">Your question</label>
          <input
            id="question"
            name="question"
            type="text"
            placeholder="What is on your mind?"
            required
          />
          <button type="submit">Reveal fortune</button>
        </form>

        <div id="fortune-output" class="fortune-output">
          <span class="placeholder">Your fortune will appear here.</span>
        </div>

        <a href="/nebula-background.html" class="link">
          View nebula background demo
        </a>
      </section>
    </main>

    <!-- Nebula background script -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.158.0/build/three.module.js"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three";

      const canvas = document.getElementById("bg-canvas");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      renderer.setClearColor(0x050816, 1);

      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x050816, 0.02);

      const camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        100
      );
      camera.position.set(0, 0, 5);
      camera.lookAt(0, 0, 0);

      const purpleLight = new THREE.PointLight(0xd946ff, 2.4, 80);
      purpleLight.position.set(-2.5, 2, 8);

      const cyanLight = new THREE.PointLight(0x5ee7ff, 2.0, 80);
      cyanLight.position.set(3, -1.5, 7);

      const pinkLight = new THREE.PointLight(0xff6ad5, 1.8, 70);
      pinkLight.position.set(0, -3, 6);

      scene.add(purpleLight, cyanLight, pinkLight);
      scene.add(new THREE.AmbientLight(0x1f2937, 1.1));

      const loader = new THREE.TextureLoader();
      const smokeTexture = loader.load("/server/assets/smoke.png");

      const cloudGeo = new THREE.PlaneGeometry(4, 4);
      const clouds = [];

      for (let i = 0; i < 50; i++) {
        const tintColors = [0xd946ff, 0xff6ad5, 0x5ee7ff];
        const tint = tintColors[i % tintColors.length];

        const material = new THREE.MeshLambertMaterial({
          map: smokeTexture,
          color: tint,
          transparent: true,
          opacity: 0.95,
          depthWrite: false,
          side: THREE.DoubleSide
        });

        const cloud = new THREE.Mesh(cloudGeo, material);

        if (i < 20) {
          const angle = (i / 20) * Math.PI * 2;
          const radius = 4.3;
          cloud.position.set(
            Math.cos(angle) * radius,
            Math.sin(angle) * radius,
            -0.5
          );
        } else {
          cloud.position.set(
            (Math.random() - 0.5) * 4,
            (Math.random() - 0.5) * 4,
            -1 - Math.random() * 1.5
          );
        }

        cloud.rotation.z = Math.random() * Math.PI * 2;
        scene.add(cloud);
        clouds.push(cloud);
      }

      function onResize() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        renderer.setSize(w, h);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      }
      window.addEventListener("resize", onResize);

      function animate() {
        requestAnimationFrame(animate);

        clouds.forEach((cloud, i) => {
          const dir = i % 2 === 0 ? 1 : -1;
          cloud.rotation.z += 0.0022 * dir;
        });

        renderer.render(scene, camera);
      }
      animate();

      // === SPLASH → APP TRANSITION ===
      const splash = document.getElementById("splash");
      const appRoot = document.getElementById("app-root");
      const splashTitle = document.getElementById("splash-title");
      const splashWheel = document.querySelector(".splash-wheel");

      // Title intro: 0.5s delay + 3s duration = 3.5s finish
      // Wait 1000ms after splash finishes = 4.5s total
      const splashFinishTime = 3500; // 0.5s delay + 3s animation
      const transitionDelay = 1000; // 1000ms after splash finishes
      const totalDelay = splashFinishTime + transitionDelay; // 4.5s

      setTimeout(() => {
        // Move title and wheel to body to keep them visible during transition
        if (splashTitle) {
          const rect = splashTitle.getBoundingClientRect();
          const computedStyle = window.getComputedStyle(splashTitle);
          
          // Capture the center point of the title
          const centerX = rect.left + rect.width / 2;
          const centerY = rect.top + rect.height / 2;
          
          // Calculate target scale: final width should be 25% of viewport width
          const currentWidth = rect.width;
          const targetWidth = window.innerWidth * 0.25;
          const targetScale = targetWidth / currentWidth;
          
          console.log("Moving title - center:", centerX, centerY, "scale:", targetScale);
          
          // Move to body to make it independent of splash overlay
          document.body.appendChild(splashTitle);
          
          // Preserve current visual position - center it at its current location
          splashTitle.style.position = "fixed";
          splashTitle.style.top = centerY + "px";
          splashTitle.style.left = centerX + "px";
          splashTitle.style.transform = "translate(-50%, -50%) scale(1)";
          splashTitle.style.fontSize = computedStyle.fontSize;
          splashTitle.style.fontFamily = computedStyle.fontFamily;
          splashTitle.style.color = computedStyle.color;
          splashTitle.style.textShadow = computedStyle.textShadow;
          splashTitle.style.zIndex = "10";
          splashTitle.style.opacity = "1";
          splashTitle.style.pointerEvents = "none";
          splashTitle.style.display = "flex";
          splashTitle.style.flexDirection = "column";
          splashTitle.style.alignItems = "center";
          splashTitle.style.gap = "0.05em";
          
          // Store initial position and target scale for animation
          splashTitle.style.setProperty("--start-top", centerY + "px");
          splashTitle.style.setProperty("--start-left", centerX + "px");
          splashTitle.style.setProperty("--target-scale", targetScale);
          
          // Force reflow to ensure position is set
          splashTitle.offsetHeight;
        }
        
        // Move wheel to body so it can fade independently (stays in same position)
        if (splashWheel) {
          const wheelRect = splashWheel.getBoundingClientRect();
          const wheelComputedStyle = window.getComputedStyle(splashWheel);
          
          // Capture current position and transform
          const wheelCenterX = wheelRect.left + wheelRect.width / 2;
          const wheelCenterY = wheelRect.top + wheelRect.height / 2;
          const currentTransform = wheelComputedStyle.transform;
          
          // Move to body to make it independent of splash overlay
          document.body.appendChild(splashWheel);
          
          // Preserve current visual position - keep it exactly where it is
          splashWheel.style.position = "fixed";
          splashWheel.style.top = wheelCenterY + "px";
          splashWheel.style.left = wheelCenterX + "px";
          // Set base transform to center the wheel (animation will add rotation)
          splashWheel.style.transform = "translate(-50%, -50%)";
          splashWheel.style.width = wheelComputedStyle.width;
          splashWheel.style.height = wheelComputedStyle.height;
          splashWheel.style.filter = wheelComputedStyle.filter;
          splashWheel.style.zIndex = "9";
          splashWheel.style.pointerEvents = "none";
          splashWheel.style.opacity = "1";
          
          // Force reflow
          splashWheel.offsetHeight;
        }
        
        // Trigger title animation and wheel fade-out
        setTimeout(() => {
          if (splashTitle) {
            console.log("Adding to-top class to title");
            splashTitle.classList.add("to-top");
          }
          // Fade out wheel at the same time (wheel stays in place)
          if (splashWheel) {
            console.log("Fading out wheel, current opacity:", window.getComputedStyle(splashWheel).opacity);
            splashWheel.classList.add("fade-out");
            // Force reflow to trigger animation
            splashWheel.offsetHeight;
            console.log("After adding fade-out, opacity:", window.getComputedStyle(splashWheel).opacity);
            console.log("Animation:", window.getComputedStyle(splashWheel).animation);
          }
        }, 100);

        // Show the app (input box appears)
        appRoot.classList.add("visible");

        // Fade out the splash overlay background (title and wheel are now independent)
        splash.style.transition = "opacity 0.8s ease";
        splash.style.opacity = "0";

        // Hide splash overlay after fade completes
        setTimeout(() => {
          splash.style.display = "none";
        }, 900);
      }, totalDelay);
    </script>

    <!-- Your existing app JS -->
    <script type="module" src="./main.js"></script>
  </body>
</html>
