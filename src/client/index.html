  <!-- Nebula background script -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.158.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from "three";

    const canvas = document.getElementById("bg-canvas");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    
    // Fix for mobile viewport - force full coverage
    function updateRendererSize() {
      const width = Math.max(window.innerWidth, document.documentElement.clientWidth);
      const height = Math.max(window.innerHeight, document.documentElement.clientHeight);
      renderer.setSize(width, height, false);
      canvas.style.width = '100vw';
      canvas.style.height = '100vh';
      canvas.width = width * Math.min(window.devicePixelRatio, 2);
      canvas.height = height * Math.min(window.devicePixelRatio, 2);
    }
    
    updateRendererSize();
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    renderer.setClearColor(0x020617, 1);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x3030ff, 0.005);

    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(0, 0, 0.8);
    camera.lookAt(0, 0, 0);

    // SUPER BRIGHT LIGHTS
    const purpleLight = new THREE.PointLight(0xd946ff, 10, 150);
    purpleLight.position.set(-2.5, 2, 8);

    const cyanLight = new THREE.PointLight(0x5ee7ff, 10, 150);
    cyanLight.position.set(3, -1.5, 7);

    const pinkLight = new THREE.PointLight(0xff6ad5, 10, 150);
    pinkLight.position.set(0, -3, 6);

    scene.add(purpleLight, cyanLight, pinkLight);
    scene.add(new THREE.AmbientLight(0x1f2937, 1.1));

    const loader = new THREE.TextureLoader();
    const smokeTexture = loader.load("./assets/smoke.png");

    const cloudGeo = new THREE.PlaneGeometry(4, 4);
    const clouds = [];

    for (let i = 0; i < 20; i++) {
      const tintColors = [0xd946ff, 0xff6ad5, 0x5ee7ff];
      const tint = tintColors[i % tintColors.length];

      const material = new THREE.MeshLambertMaterial({
        map: smokeTexture,
        color: tint,
        transparent: true,
        opacity: 0.95,
        depthWrite: false,
        side: THREE.DoubleSide
      });

      const cloud = new THREE.Mesh(cloudGeo, material);

      if (i < 8) {
        const angle = (i / 8) * Math.PI * 2;
        const radius = 4.3;
        cloud.position.set(
          Math.cos(angle) * radius,
          Math.sin(angle) * radius,
          -0.5
        );
      } else {
        cloud.position.set(
          (Math.random() - 0.5) * 4,
          (Math.random() - 0.5) * 4,
          -1 - Math.random() * 1.5
        );
      }

      cloud.rotation.z = Math.random() * Math.PI * 2;
      scene.add(cloud);
      clouds.push(cloud);
    }

    function onResize() {
      updateRendererSize();
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
    }
    window.addEventListener("resize", onResize);

    let bgAnimId;
    function animate() {
      bgAnimId = requestAnimationFrame(animate);

      clouds.forEach((cloud, i) => {
        const dir = i % 2 === 0 ? 1 : -1;
        cloud.rotation.z += 0.001 * dir;
      });

      renderer.render(scene, camera);
    }
    animate();

    // Allow main.js to pause/resume background during consulting overlay
    window.pauseBg = () => { cancelAnimationFrame(bgAnimId); bgAnimId = null; };
    window.resumeBg = () => { if (!bgAnimId) animate(); };
  </script>
