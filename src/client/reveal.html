<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Your Fortune - Ask Esmeralda</title>
  <link rel="icon" type="image/x-icon" href="./favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rye&family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="./style.css" />
  
  <style>
    /* Fortune reveal fade-in animation */
    .fortune-view.visible {
      animation: revealFortune 2.5s ease-out forwards;
    }
    
    @keyframes revealFortune {
      0% {
        opacity: 0;
        transform: scale(0.95);
      }
      40% {
        opacity: 0; /* Stay hidden while "clouds clear" */
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>
<body>
  <!-- Nebula background canvas -->
  <canvas id="bg-canvas"></canvas>

  <!-- Fortune reveal view -->
  <main class="app reveal-page" id="app-root">
    <section class="fortune-view visible" id="fortune-view">
      <div class="fortune-card">
        <div class="fortune-text" id="fortune-text">
          Loading your fortune...
        </div>
      </div>
      <p class="fortune-message">
        Esmeralda has spoken.<br>
        Return when the moon rises anew.
      </p>
    </section>
  </main>

  <!-- Nebula background script -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.158.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from "three";

    // Same nebula background setup
    const canvas = document.getElementById("bg-canvas");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x0D47A1, 1);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x3030ff, 0.005);

    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(0, 0, 0.8);
    camera.lookAt(0, 0, 0);

    const purpleLight = new THREE.PointLight(0xd946ff, 10, 150);
    purpleLight.position.set(-2.5, 2, 8);

    const cyanLight = new THREE.PointLight(0x5ee7ff, 10, 150);
    cyanLight.position.set(3, -1.5, 7);

    const pinkLight = new THREE.PointLight(0xff6ad5, 10, 150);
    pinkLight.position.set(0, -3, 6);

    scene.add(purpleLight, cyanLight, pinkLight);
    scene.add(new THREE.AmbientLight(0x1f2937, 1.1));

    const loader = new THREE.TextureLoader();
    const smokeTexture = loader.load("/server/assets/smoke.png");

    const cloudGeo = new THREE.PlaneGeometry(4, 4);
    const clouds = [];

    for (let i = 0; i < 50; i++) {
      const tintColors = [0xd946ff, 0xff6ad5, 0x5ee7ff];
      const tint = tintColors[i % tintColors.length];

      const material = new THREE.MeshLambertMaterial({
        map: smokeTexture,
        color: tint,
        transparent: true,
        opacity: 0.95,
        depthWrite: false,
        side: THREE.DoubleSide
      });

      const cloud = new THREE.Mesh(cloudGeo, material);

      if (i < 20) {
        const angle = (i / 20) * Math.PI * 2;
        const radius = 4.3;
        cloud.position.set(
          Math.cos(angle) * radius,
          Math.sin(angle) * radius,
          -0.5
        );
      } else {
        cloud.position.set(
          (Math.random() - 0.5) * 4,
          (Math.random() - 0.5) * 4,
          -1 - Math.random() * 1.5
        );
      }

      cloud.rotation.z = Math.random() * Math.PI * 2;
      scene.add(cloud);
      clouds.push(cloud);
    }

    function onResize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      renderer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    window.addEventListener("resize", onResize);

    function animate() {
      requestAnimationFrame(animate);
      clouds.forEach((cloud, i) => {
        const dir = i % 2 === 0 ? 1 : -1;
        cloud.rotation.z += 0.001 * dir;
      });
      renderer.render(scene, camera);
    }
    animate();

    // Load fortune from sessionStorage
    console.log("Reveal page loaded, checking sessionStorage...");
    const fortuneText = sessionStorage.getItem('fortuneText');
    const userQuestion = sessionStorage.getItem('userQuestion');

    console.log("fortuneText:", fortuneText);
    console.log("userQuestion:", userQuestion);

    const fortuneElement = document.getElementById('fortune-text');

    if (fortuneText) {
      console.log("Fortune found! Displaying...");
      fortuneElement.textContent = fortuneText;
    } else {
      console.log("No fortune found in sessionStorage, redirecting to home...");
      // No fortune data - redirect back to home
      window.location.href = '/';
    }
  </script>
</body>
</html>
