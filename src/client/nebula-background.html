<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FORTUNA Nebula</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="stylesheet" href="./style.css" />

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.158.0/build/three.module.js"
        }
      }
    </script>
  </head>
  <body class="nebula-demo">
    <canvas id="bg-canvas"></canvas>
        <script type="module">
      import * as THREE from "three";

      const canvas = document.getElementById("bg-canvas");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      // Background
      renderer.setClearColor(0x050816, 1);

      const scene = new THREE.Scene();
      // Fog strength (higher = more fade into background)
      scene.fog = new THREE.FogExp2(0x050816, 0.02); // <---- fog density

      // Camera
      const camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        100
      );
      camera.position.set(0, 0, 5);
      camera.lookAt(0, 0, 0);

      // Lights
      const purpleLight = new THREE.PointLight(0xd946ff, 2.4, 80);
      purpleLight.position.set(-2.5, 2, 8);

      const cyanLight = new THREE.PointLight(0x5ee7ff, 2.0, 80);
      cyanLight.position.set(3, -1.5, 7);

      const pinkLight = new THREE.PointLight(0xff6ad5, 1.8, 70);
      pinkLight.position.set(0, -3, 6);

      scene.add(purpleLight, cyanLight, pinkLight);
      scene.add(new THREE.AmbientLight(0x1f2937, 1.1));

      // Smoke texture
      const loader = new THREE.TextureLoader();
      const smokeTexture = loader.load("/server/assets/smoke.png");

      const cloudGeo = new THREE.PlaneGeometry(4, 4);
      const clouds = [];

      // 50 planes: outer ring + center fill
      for (let i = 0; i < 50; i++) {
        const tintColors = [0xd946ff, 0xff6ad5, 0x5ee7ff];
        const tint = tintColors[i % tintColors.length];

        const material = new THREE.MeshLambertMaterial({
          map: smokeTexture,
          color: tint,
          transparent: true,
          // CLOUD VISIBILITY: raise/lower this to change density
          opacity: 0.95,           // <---- try 0.8–1.0
          depthWrite: false,
          side: THREE.DoubleSide
        });

        const cloud = new THREE.Mesh(cloudGeo, material);

        if (i < 20) {
          const angle = (i / 20) * Math.PI * 2;
          const radius = 4.3;
          cloud.position.set(
            Math.cos(angle) * radius,
            Math.sin(angle) * radius,
            -0.5
          );
        } else {
          cloud.position.set(
            (Math.random() - 0.5) * 4,
            (Math.random() - 0.5) * 4,
            -1 - Math.random() * 1.5
          );
        }

        cloud.rotation.z = Math.random() * Math.PI * 2;
        scene.add(cloud);
        clouds.push(cloud);
      }

      function onResize() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        renderer.setSize(w, h);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      }
      window.addEventListener("resize", onResize);

      function animate() {
        requestAnimationFrame(animate);

        clouds.forEach((cloud, i) => {
          const dir = i % 2 === 0 ? 1 : -1;
          // SPEED: higher value = faster rotation
          cloud.rotation.z += 0.0022 * dir; // <---- try 0.001–0.004
        });

        renderer.render(scene, camera);
      }
      animate();
    </script>

  </body>
</html>
